<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.v{width:1000px;height:1000px;display:grid;place-items:center}
.v svg{width:1000px;height:1000px}
.light{background:#FFF6F9}
.pink{background:#E8457F}
.dark{background:#0E0C0F}
</style></head><body>
<template id="t">
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pg-ID" cx="50%" cy="85%" r="90%">
      <stop offset="0" stop-color="var(--p1)"/><stop offset="1" stop-color="var(--p2)"/>
    </radialGradient>
    <path id="petal-ID" d="M0 -18 C -70 -60 -112 -160 -64 -238 C -44 -262 -22 -262 -10 -246 L 0 -224 L 10 -246 C 22 -262 44 -262 64 -238 C 112 -160 70 -60 0 -18 Z"/>
  </defs>
  <g transform="translate(500 380)">
    <g fill="url(#pg-ID)" stroke="var(--edge)" stroke-width="5" stroke-linejoin="round">
      <use href="#petal-ID"/><use href="#petal-ID" transform="rotate(72)"/><use href="#petal-ID" transform="rotate(144)"/><use href="#petal-ID" transform="rotate(216)"/><use href="#petal-ID" transform="rotate(288)"/>
    </g>
    <g stroke="var(--stamen)" stroke-width="3.5" stroke-linecap="round" fill="var(--stamen)">
      <line x1="0" y1="0" x2="0" y2="-120"/><circle cx="0" cy="-124" r="8"/>
      <line x1="0" y1="0" x2="-48" y2="-106"/><circle cx="-50" cy="-110" r="7"/>
      <line x1="0" y1="0" x2="48" y2="-106"/><circle cx="50" cy="-110" r="7"/>
      <line x1="0" y1="0" x2="-86" y2="-74"/><circle cx="-90" cy="-77" r="7"/>
      <line x1="0" y1="0" x2="86" y2="-74"/><circle cx="90" cy="-77" r="7"/>
    </g>
    <circle r="30" fill="var(--stamen)"/>
    <circle r="14" fill="var(--core)" opacity=".55"/>
  </g>
  <text x="500" y="790" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="128" letter-spacing="34" fill="var(--word)">САКУРА</text>
  <text x="500" y="868" text-anchor="middle" font-family="Manrope" font-weight="500" font-size="40" letter-spacing="14" fill="var(--sub)">салон красоты</text>
</svg>
</template>
<div class="v light" id="light" style="--p1:#FFC2D9;--p2:#F2559A;--edge:#C8235F;--stamen:#C8235F;--core:#FFF6F9;--mono:#B01E5A;--word:#B01E5A;--sub:#E8457F"></div>
<div class="v pink" id="pink" style="--p1:#FFFFFF;--p2:#FFD3E4;--edge:#FFFFFF;--stamen:#FFFFFF;--core:#E8457F;--mono:#FFFFFF;--word:#FFFFFF;--sub:#FFE3EE"></div>
<div class="v dark" id="dark" style="--p1:#FFD0E4;--p2:#F25C9E;--edge:#FF9CC6;--stamen:#FFB5D5;--core:#FFFFFF;--mono:#FFB5D5;--word:#FFB5D5;--sub:#F6B4D2"></div>
<div class="v" id="clear" style="--p1:#FFC2D9;--p2:#F2559A;--edge:#C8235F;--stamen:#C8235F;--core:#FFFFFF;--mono:#B01E5A;--word:#B01E5A;--sub:#E8457F"></div>
<script>
const t=document.getElementById('t').innerHTML;
for(const id of ['light','pink','dark','clear']) document.getElementById(id).innerHTML=t.replaceAll('ID',id);
</script>
</body></html>
